name: Build FAP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: pip install ufbt

      - name: Build FAP
        run: ufbt

      - name: Self-test 3DES core
        run: gcc -std=c11 -Wall -Wextra -DDES3_SELFTEST -o /tmp/des3 des3.c && /tmp/des3

      - name: Verify artifact exists
        run: |
          test -s dist/nfc_eraser.fap
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: nfc_eraser-fap
          path: dist/nfc_eraser.fap

      # Rolling build for branch pushes: keeps a stable download URL.
      - name: Publish rolling build
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NFC Eraser - latest build
          make_latest: false
          body: |
            Automatically built from commit ${{ github.sha }}.

            Download `nfc_eraser.fap` below and copy it to `apps/NFC/` on your
            Flipper Zero SD card, then open Applications -> NFC -> NFC Eraser.
          files: dist/nfc_eraser.fap

      # Versioned release, created by pushing a v* tag.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NFC Eraser ${{ github.ref_name }}
          make_latest: true
          body: |
            Built from ${{ github.sha }}.

            Download `nfc_eraser.fap` and copy it to `apps/NFC/` on your Flipper
            Zero SD card, then open Applications -> NFC -> NFC Eraser.

            Requires official firmware 1.5.x (built against target 7, API 88.2).
          files: dist/nfc_eraser.fap
